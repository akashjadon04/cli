[advisories]
yanked = "deny"
ignore = [
    # Upstream blob: origin recursive parse stack depth limit in url <= 2.5.8
    "RUSTSEC-2026-0592",
]

[licenses]
# Our own crates are unpublished and proprietary; skip them, check dependencies.
private = { ignore = true }
allow = [
    "CDLA-Permissive-2.0",   # webpki-roots CA certificate data
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[bans]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
