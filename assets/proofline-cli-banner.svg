<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" fill="none">
  <defs>
    <linearGradient id="plGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="plGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="120" rx="16" fill="#0C0E17" stroke="#1E2338" stroke-width="1.5"/>

  <!-- Matrix Grid Background Accent -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="0.8">
    <line x1="20" y1="30" x2="700" y2="30" />
    <line x1="20" y1="60" x2="700" y2="60" />
    <line x1="20" y1="90" x2="700" y2="90" />
    <line x1="120" y1="10" x2="120" y2="110" />
    <line x1="240" y1="10" x2="240" y2="110" />
    <line x1="360" y1="10" x2="360" y2="110" />
    <line x1="480" y1="10" x2="480" y2="110" />
    <line x1="600" y1="10" x2="600" y2="110" />
  </g>

  <!-- CLI Shield & Terminal Prompt Icon -->
  <g transform="translate(36, 22)">
    <!-- Hexagonal Security Shield -->
    <polygon points="38,8 68,14 68,54 38,68 8,54 8,14" fill="#131728" stroke="url(#plGrad)" stroke-width="2" />
    
    <!-- Terminal Prompt Prompt Glyphs -->
    <path d="M 22 32 L 32 38 L 22 44" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="36" y1="44" x2="52" y2="44" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Pulse Node -->
    <circle cx="58" cy="22" r="3.5" fill="#38BDF8" filter="url(#plGlow)" />
  </g>

  <!-- Typography -->
  <text x="136" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#F8FAFC">PROOFLINE<tspan fill="url(#plGrad)">CLI</tspan></text>
  <text x="138" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="2.2" fill="#94A3B8">SOVEREIGN CODE REVIEW &amp; AGENT GOVERNANCE RUNTIME</text>

  <!-- Status Pill -->
  <g transform="translate(505, 42)">
    <rect width="185" height="34" rx="17" fill="#131728" stroke="#252D4A" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#10B981" />
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" letter-spacing="0.8">RUST NATIVE • MCP READY</text>
  </g>
</svg>